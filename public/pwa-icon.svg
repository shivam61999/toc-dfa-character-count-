<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#090d16" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#grad)" stroke-width="4" opacity="0.6" />
  
  <!-- Outer Automaton Accept State Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="16 8" opacity="0.8" />
  <circle cx="256" cy="256" r="160" fill="#0f172a" stroke="#38bdf8" stroke-width="12" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="142" fill="none" stroke="#10b981" stroke-width="6" />

  <!-- Delta Symbol δ -->
  <text x="256" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="160" font-weight="900" fill="url(#grad)" text-anchor="middle" dominant-baseline="middle">
    δ
  </text>
  
  <!-- Subscript 3m, 2n text pill -->
  <rect x="146" y="380" width="220" height="42" rx="21" fill="#1e1b4b" stroke="#6366f1" stroke-width="3" />
  <text x="256" y="407" font-family="monospace" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">
    a:3m | b:2n
  </text>
</svg>
